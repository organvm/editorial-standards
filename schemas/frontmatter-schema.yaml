# frontmatter-schema.yaml — ORGAN-V Essay Frontmatter Specification
# Version: 1.0
# Governs: All essays in organvm-v-logos/public-process/_posts/

schema_version: "1.0"
description: >
  Defines required frontmatter fields, types, and constraints for all essays
  published through the ORGAN-V public-process site. The essay-pipeline
  validator enforces this schema on every push.

required_fields:
  layout:
    type: string
    enum: [essay]
    description: "Jekyll layout — always 'essay' for published essays"

  title:
    type: string
    min_length: 10
    max_length: 200
    description: "Essay title. Descriptive, not clickbait."

  author:
    type: string
    pattern: "^@"
    description: "GitHub handle with @ prefix"

  date:
    type: string
    format: "YYYY-MM-DD"
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    description: "Publication date in ISO 8601 format"

  tags:
    type: list
    min_items: 2
    max_items: 8
    item_type: string
    item_pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    description: "Lowercase, hyphenated topic tags. See tag-governance.yaml."

  category:
    type: string
    enum: [meta-system, case-study, retrospective, guide, methodology]
    description: "One of the 5 canonical categories. See category-taxonomy.yaml."

  excerpt:
    type: string
    min_length: 50
    max_length: 400
    description: "One-paragraph summary shown on index pages and in feeds."

  portfolio_relevance:
    type: string
    enum: [CRITICAL, HIGH, MEDIUM]
    description: "How central this essay is to the portfolio narrative."

  related_repos:
    type: list
    item_type: string
    item_pattern: >-
      ^(?:organvm|organvm-(?:i|ii|iii|iv|v|vi|vii|viii)-[a-z0-9]+(?:-[a-z0-9]+)*|meta-organvm(?:-[a-z0-9]+)*)/(?![.]{1,2}$)[A-Za-z0-9._-]{1,100}$
    description: >-
      Canonical case-preserving owner/repository slugs in the consolidated organvm,
      legacy numbered organvm-*, meta-organvm, or meta-organvm-* organizations.

  reading_time:
    type: string
    pattern: "^\\d+ min$"
    description: "Estimated reading time, e.g. '12 min'."

  word_count:
    type: integer
    min: 500
    description: "Approximate word count of the essay body."

  references:
    type: list
    min_items: 0
    item_type: string
    description: "Citation strings for sources referenced in the essay. Supports two formats: inline hyperlinks in body text and numbered [N] footnotes for books/academic sources. Rendered as an ordered list at essay bottom. Use references: [] for essays with no external citations."

optional_fields:
  word_count_policy:
    type: string
    enum: [computed, external]
    description: "Word-count integrity mode. 'computed' enforces exact body-word match. 'external' allows aggregate counts with required override reason."

  word_count_override_reason:
    type: string
    min_length: 20
    max_length: 300
    description: "Required when word_count_policy is 'external'. Explain why declared word_count differs from this file's computed body word count."
