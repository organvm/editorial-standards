# quality-rubric.yaml — Essay Quality Scoring System
# Version: 1.0
# 100-point scale across 5 dimensions (20 points each)

schema_version: "1.0"
description: >
  Scoring rubric for evaluating essay quality. Used during editorial review,
  not enforced by CI. Each dimension scored 0-20.

total_points: 100

dimensions:
  clarity:
    max_points: 20
    description: "Clear prose, defined terminology, and logical organization"
    scoring:
      20: "Clear, well-organized, with minimal jargon or jargon well-defined."
      15: "Generally clear with occasional dense passages."
      10: "Requires significant effort to follow; restructuring is needed."
      5: "Unclear and in need of a major rewrite."
      0: "No comprehensible argument or usable structure."

  accuracy:
    max_points: 20
    description: "Factual correctness and fidelity to the implementation"
    scoring:
      20: "All claims are verifiable and technical details are correct."
      15: "Minor inaccuracies do not affect the argument."
      10: "Errors could mislead the reader and require correction."
      5: "The central account is fundamentally inaccurate."
      0: "Claims are contradicted by the available evidence."

  insight_density:
    max_points: 20
    description: "Novel or useful information relative to the reader's time"
    scoring:
      20: "Nearly every paragraph offers something new or useful."
      15: "Strong core insights with some padding."
      10: "Useful insight is buried under context or repetition."
      5: "Little new information; the essay could be substantially shorter."
      0: "No material insight beyond generic or repeated statements."

  cross_referencing:
    max_points: 20
    description: "Meaningful links to related organs, repositories, essays, and concepts"
    scoring:
      20: "Rich, meaningful connections to other system components."
      15: "Relevant cross-references exist but could be integrated more deeply."
      10: "System context is present but sparse or weakly connected."
      5: "Minimal system context; the essay reads mostly as standalone."
      0: "No meaningful cross-references or system context."

  portfolio_relevance:
    max_points: 20
    description: "Contribution to the public narrative of the system"
    scoring:
      20: "Essential reading for understanding the system."
      15: "Useful but not critical; it adds meaningful depth."
      10: "Marginal public relevance; internal documentation may be a better fit."
      5: "The connection to the public collection is weak."
      0: "The essay does not serve the public-process collection."

thresholds:
  publish: 60
  flagship_candidate: 80
  exemplar: 90
