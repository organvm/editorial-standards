name: Editorial Standards CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate YAML schemas
        run: |
          python3 -c "
          import yaml, glob, sys
          errors = 0
          for f in glob.glob('schemas/*.yaml'):
              try:
                  data = yaml.safe_load(open(f))
                  if not isinstance(data, dict):
                      print(f'::error file={f}::Not a valid YAML mapping')
                      errors += 1
                  else:
                      print(f'::notice file={f}::Valid ({len(data)} top-level keys)')
              except Exception as e:
                  print(f'::error file={f}::{e}')
                  errors += 1
          if errors:
              sys.exit(1)
          print(f'All {len(glob.glob(\"schemas/*.yaml\"))} schema files valid')
          "

      - name: Validate template contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys
          import yaml

          essay_templates = {
              Path("templates/case-study.md"),
              Path("templates/guide.md"),
              Path("templates/meta-system.md"),
              Path("templates/methodology.md"),
              Path("templates/retrospective.md"),
          }
          publication_templates = essay_templates | {Path("templates/log.md")}
          reader_mode_templates = {
              Path("templates/repository-readme-v2.md"),
              Path("templates/evidence.md"),
              Path("templates/audiences/business.md"),
              Path("templates/audiences/evaluator.md"),
              Path("templates/audiences/general.md"),
              Path("templates/audiences/humanities.md"),
              Path("templates/audiences/technical.md"),
          }

          errors = 0
          overlap = publication_templates & reader_mode_templates
          if overlap:
              print(f"::error::Template contracts overlap: {sorted(map(str, overlap))}")
              errors += 1

          for path in sorted(publication_templates):
              if not path.is_file():
                  print(f"::error file={path}::Required publication template missing")
                  errors += 1
                  continue
              content = path.read_text(encoding="utf-8")
              parts = content.split("---", 2)
              if not content.startswith("---") or len(parts) < 3:
                  print(f"::error file={path}::Missing or incomplete essay frontmatter")
                  errors += 1
              else:
                  print(f"::notice file={path}::Valid publication template")

          frontmatter_schema = yaml.safe_load(
              Path("schemas/frontmatter-schema.yaml").read_text(encoding="utf-8")
          )
          required_fields = set(frontmatter_schema["required_fields"])
          optional_fields = set(frontmatter_schema.get("optional_fields", {}))
          allowed_fields = required_fields | optional_fields

          for path in sorted(essay_templates):
              content = path.read_text(encoding="utf-8")
              parts = content.split("---", 2)
              if len(parts) < 3:
                  continue
              frontmatter = yaml.safe_load(parts[1])
              if not isinstance(frontmatter, dict):
                  print(f"::error file={path}::Essay frontmatter is not a mapping")
                  errors += 1
                  continue
              fields = set(frontmatter)
              missing = sorted(required_fields - fields)
              unknown = sorted(fields - allowed_fields)
              if missing:
                  print(f"::error file={path}::Missing required frontmatter fields: {missing}")
                  errors += 1
              if unknown:
                  print(f"::error file={path}::Unknown frontmatter fields: {unknown}")
                  errors += 1

          related_repos_pattern = re.compile(
              frontmatter_schema["required_fields"]["related_repos"]["item_pattern"]
          )
          valid_related_repos = (
              "organvm/essay-pipeline",
              "organvm/editorial-standards",
              "organvm/.github",
              "organvm-iv-taxis/schema-definitions",
              "organvm-i-theoria/4-ivi374-F0Rivi4",
              "organvm-vi-koinonia/public-process",
              "organvm-viii-operations/future-project",
              "meta-organvm/organvm-corpvs-testamentvm",
          )
          invalid_related_repos = (
              "essay-pipeline",
              "github.com/organvm/essay-pipeline",
              "other/essay-pipeline",
              "4444j99/portfolio",
              "local/_portal",
              "organvm-evil/essay-pipeline",
              "organvm/",
              "organvm/.",
              "organvm/..",
              "organvm//essay-pipeline",
              "organvm/../essay-pipeline",
              "organvm/essay pipeline",
              "organvm/essay-pipeline/readme",
              "organvm/essay-pipeline?tab=readme",
          )
          for slug in valid_related_repos:
              if related_repos_pattern.fullmatch(slug) is None:
                  print(
                      "::error file=schemas/frontmatter-schema.yaml::"
                      f"Rejected canonical related_repos slug: {slug}"
                  )
                  errors += 1
          for slug in invalid_related_repos:
              if related_repos_pattern.fullmatch(slug) is not None:
                  print(
                      "::error file=schemas/frontmatter-schema.yaml::"
                      f"Accepted invalid related_repos slug: {slug}"
                  )
                  errors += 1

          readme = Path("README.md").read_text(encoding="utf-8")
          obsolete_field_guidance = (
              "Must match the `slug` frontmatter field",
              "No markdown in the abstract field",
              "The `organs_referenced` array",
          )
          for phrase in obsolete_field_guidance:
              if phrase in readme:
                  print(f"::error file=README.md::Obsolete frontmatter guidance: {phrase}")
                  errors += 1
          expected_count_phrases = (
              f"the {len(required_fields)} required metadata fields",
              f"All {len(required_fields)} required fields",
          )
          for phrase in expected_count_phrases:
              if phrase not in readme:
                  print(f"::error file=README.md::Missing schema-derived field count: {phrase}")
                  errors += 1
          frontmatter_section = readme.split("## Frontmatter Schema", 1)
          if len(frontmatter_section) != 2:
              print("::error file=README.md::Missing Frontmatter Schema section")
              errors += 1
          else:
              frontmatter_section = frontmatter_section[1].split("\n## ", 1)[0]
              table_fields = re.findall(
                  r"^\|\s*`([^`]+)`\s*\|",
                  frontmatter_section,
                  flags=re.MULTILINE,
              )
              duplicate_fields = sorted(
                  field for field in set(table_fields) if table_fields.count(field) > 1
              )
              table_field_set = set(table_fields)
              if duplicate_fields:
                  print(
                      "::error file=README.md::"
                      f"Duplicate frontmatter table fields: {duplicate_fields}"
                  )
                  errors += 1
              if table_field_set != required_fields:
                  missing = sorted(required_fields - table_field_set)
                  extra = sorted(table_field_set - required_fields)
                  print(
                      "::error file=README.md::Frontmatter table/schema mismatch: "
                      f"missing={missing}, extra={extra}"
                  )
                  errors += 1

          for path in sorted(reader_mode_templates):
              if not path.is_file():
                  print(f"::error file={path}::Required reader-mode template missing")
                  errors += 1
                  continue
              content = path.read_text(encoding="utf-8")
              if not content.lstrip().startswith("# "):
                  print(f"::error file={path}::Reader-mode template must start with a level-one heading")
                  errors += 1
              else:
                  print(f"::notice file={path}::Valid reader-mode template")

          if errors:
              sys.exit(1)
          print(
              f"Validated {len(publication_templates)} publication templates and "
              f"{len(reader_mode_templates)} reader-mode templates"
          )
          PY

      - name: Validate structure
        run: |
          test -f "README.md" && echo "::notice::README.md found" || echo "::warning::No README.md found"
          test -f "LICENSE" && echo "::notice::License file found" || echo "::warning::No license file found"
          test -f "docs/reader-mode-documentation.md" && echo "::notice::Reader-mode standard found" || exit 1

      - name: Success
        run: echo "::notice::Editorial Standards CI passed"
