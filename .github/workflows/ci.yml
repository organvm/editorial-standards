name: Editorial Standards CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate YAML schemas
        run: |
          python3 -c "
          import yaml, glob, sys
          errors = 0
          for f in glob.glob('schemas/*.yaml'):
              try:
                  data = yaml.safe_load(open(f))
                  if not isinstance(data, dict):
                      print(f'::error file={f}::Not a valid YAML mapping')
                      errors += 1
                  else:
                      print(f'::notice file={f}::Valid ({len(data)} top-level keys)')
              except Exception as e:
                  print(f'::error file={f}::{e}')
                  errors += 1
          if errors:
              sys.exit(1)
          print(f'All {len(glob.glob(\"schemas/*.yaml\"))} schema files valid')
          "

      - name: Validate editorial contracts
        run: python3 scripts/validate_editorial_contracts.py

      - name: Run adversarial contract regressions
        run: python3 -m unittest discover -s tests -v

      - name: Validate structure
        run: |
          test -f "README.md" && echo "::notice::README.md found" || echo "::warning::No README.md found"
          test -f "LICENSE" && echo "::notice::License file found" || echo "::warning::No license file found"
          test -f "docs/reader-mode-documentation.md" && echo "::notice::Reader-mode standard found" || exit 1

      - name: Success
        run: echo "::notice::Editorial Standards CI passed"
